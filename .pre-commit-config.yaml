repos:
-   repo: local
    hooks:
    -   id: run-act
        name: Run GitHub Actions Locally
        entry: act
        language: system
        pass_filenames: false
        always_run: true
    -   id: post-commit-debug
        name: Debug Post-Commit Hook
        entry: echo "Post-commit hook debug"
        language: system
        pass_filenames: false
        always_run: true
